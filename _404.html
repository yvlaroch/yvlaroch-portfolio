<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée - Yv Laroch</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 600px; }
        h1 { font-size: 6rem; background: linear-gradient(135deg, #7E2D8B, #4169E1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1rem; }
        h2 { font-size: 2rem; margin-bottom: 1rem; }
        p { color: #888; margin-bottom: 2rem; }
        a { color: #4169E1; text-decoration: none; border: 1px solid #4169E1; padding: 0.8rem 2rem; border-radius: 50px; transition: all 0.3s; }
        a:hover { background: #4169E1; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page non trouvée</h2>
        <p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
