					<form 
    class="contact-form" 
    name="contact" 
    method="POST" 
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    action="/contact/success"
>
						  <!-- Champ Honeypot (caché aux humains, visible par les bots) -->
    <input type="hidden" name="form-name" value="contact" />
    <div style="position: absolute; left: -9999px; top: -9999px;">
        <label for="bot-field">Ne remplissez pas ce champ</label>
        <input type="text" id="bot-field" name="bot-field" />
    </div>
    
    <!-- Autres champs -->
    <input type="text" name="name" placeholder="Votre nom" required data-key="contact_form_name" />
    <input type="email" name="email" placeholder="Votre email" required data-key="contact_form_email" />
    <textarea name="message" placeholder="Votre message" required data-key="contact_form_message"></textarea>
    
    <!-- Honeypot supplémentaire (temps de remplissage) -->
    <input type="hidden" name="timestamp" id="formTimestamp" />
    
    <button type="submit" class="btn btn-primary" data-key="contact_form_send">Envoyer</button>
</form>
			</div>

<script>
    // Anti-bot : empêcher les soumissions trop rapides
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('.contact-form');
        const timestamp = document.getElementById('formTimestamp');
        if (timestamp) {
            timestamp.value = Date.now();
        }
        
        if (form) {
            form.addEventListener('submit', function(e) {
                const timeDiff = Date.now() - parseInt(timestamp.value);
                if (timeDiff < 3000) { // moins de 3 secondes = bot
                    e.preventDefault();
                    alert('Votre message a été détecté comme spam. Veuillez réessayer.');
                }
            });
        }
    });
</script>
